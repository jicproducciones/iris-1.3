<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#080711"><title>Iris 1.5.1 · Reconocimiento estable</title><style>
:root{--iris:#b78cff;--bg:#080711}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:#f3ebff;font-family:system-ui,Arial,sans-serif;overflow:hidden}main{height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative}.face{width:min(95vw,820px);height:54%;display:flex;justify-content:center;align-items:center;gap:clamp(18px,7vw,70px)}.eye{position:relative;width:clamp(75px,24vw,180px);height:clamp(110px,33vw,245px);border-radius:48% 48% 45% 45%;background:var(--iris);box-shadow:0 0 18px #a56dff88,0 0 65px #8045fa44;transform:translate(var(--look-x,0px),var(--look-y,0px)) scaleY(var(--blink,1));transition:transform .18s ease,border-radius .25s ease,height .25s ease}.eye:after{content:"";position:absolute;top:14%;left:19%;width:23%;height:17%;border-radius:50%;background:#ffffff7a;filter:blur(9px)}.face.happy .eye{height:clamp(65px,17vw,125px);border-radius:55% 55% 18% 18%;transform:translate(var(--look-x,0px),var(--look-y,0px)) rotate(var(--rot,0deg)) scaleY(var(--blink,1))}.face.happy .eye:first-child{--rot:-12deg}.face.happy .eye:last-child{--rot:12deg}.face.surprised .eye{border-radius:50%;width:clamp(90px,26vw,195px);height:clamp(120px,35vw,265px)}.face.sleepy .eye{height:clamp(22px,5vw,40px);border-radius:45%}.face.sleepy .eye:after{display:none}.face.talking .eye{animation:talk .65s ease-in-out infinite alternate}@keyframes talk{from{border-radius:48% 48% 45% 45%}to{border-radius:38% 38% 55% 55%;filter:brightness(1.2)}}.status{position:absolute;top:3%;font-size:12px;letter-spacing:.18em;color:#a78cc8}.controls{position:absolute;bottom:max(16px,env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center;flex-wrap:wrap;gap:7px;padding:0 9px}button{background:#241b39;border:1px solid #594477;border-radius:18px;color:#f2e8ff;padding:10px 12px;font-size:12px;cursor:pointer}button.active{background:#6843a3;border-color:#b78cff}.hint{position:absolute;bottom:92px;color:#b6a8ca;font-size:12px;text-align:center;padding:0 14px;max-width:520px;line-height:1.4}.meter{width:130px;height:5px;border-radius:6px;background:#3b2d50;margin:6px auto 0;overflow:hidden}.meter>div{height:100%;width:0;background:#b78cff;transition:width .1s}.micstatus{color:#d9c8ff;font-weight:600}@media (orientation:landscape){.face{height:70%}.eye{width:clamp(65px,17vw,150px);height:clamp(95px,27vh,200px)}.face.happy .eye{height:clamp(45px,15vh,100px)}.face.surprised .eye{width:clamp(75px,19vw,170px);height:clamp(105px,29vh,220px)}.face.sleepy .eye{height:25px}.hint{bottom:48px;font-size:11px}.controls{bottom:6px}button{padding:7px 10px}}
</style></head><body><main><div class="status">IRIS · 1.5.1</div><div id="face" class="face"><div class="eye"></div><div class="eye"></div></div><div class="hint"><div id="message" class="micstatus" aria-live="polite">Micrófono apagado · Tocá «Activar micrófono»</div><div id="explain">Activá el micrófono y el reconocimiento. Solo «Hola, Iris» activa mi mirada atenta; vuelvo a la normalidad tras 4,5 segundos de silencio. El volumen se analiza localmente; Chrome puede enviar audio a su servicio de reconocimiento.</div><div class="meter"><div id="bar"></div></div></div><div class="controls"><button id="mic">Activar micrófono</button><button id="voice">Reconocer «Hola, Iris»</button><button class="active" data-mode="normal">Normal</button><button data-mode="happy">Feliz</button><button data-mode="surprised">Sorpresa</button><button data-mode="sleepy">Sueño</button><button data-mode="talking">Respondiendo</button><button id="full">Pantalla completa</button></div></main><script>
const face=document.getElementById('face'),message=document.getElementById('message'),bar=document.getElementById('bar'),micButton=document.getElementById('mic');let mode='normal',stream=null,context=null,analyser=null,data=null,frame=0,heardUntil=0,level=0,attentionUntil=0,attentionActive=false,lastVoiceSound=0;const voiceButton=document.getElementById('voice');let recognition=null,voiceWanted=false,voiceRunning=false;function setMode(next){mode=next;face.className='face '+(mode==='normal'?'':mode);document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x.dataset.mode===mode))}document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));document.getElementById('full').addEventListener('click',()=>{if(document.fullscreenElement){document.exitFullscreen?.()}else{document.documentElement.requestFullscreen?.().catch(()=>{})}});function blink(){face.style.setProperty('--blink','0.07');setTimeout(()=>face.style.setProperty('--blink','1'),150)}setInterval(()=>{if(Math.random()>.25)blink()},3100);setInterval(()=>{if(mode==='sleepy')return;if(attentionActive){face.style.setProperty('--look-x','0px');face.style.setProperty('--look-y','0px');return}face.style.setProperty('--look-x',(Math.random()*16-8).toFixed(0)+'px');face.style.setProperty('--look-y',(Math.random()*10-5).toFixed(0)+'px')},800);function stop(){attentionActive=false;attentionUntil=0;stopVoice();cancelAnimationFrame(frame);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;if(context){context.close().catch(()=>{});context=null}analyser=null;bar.style.width='0%';micButton.textContent='Activar micrófono';micButton.classList.remove('active');message.textContent='Micrófono apagado · Tocá «Activar micrófono»'}async function start(){if(!navigator.mediaDevices?.getUserMedia){message.textContent='Este navegador no permite acceder al micrófono desde este archivo. Probá abrir la página desde un sitio HTTPS.';return}try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false});context=new (window.AudioContext||window.webkitAudioContext)();await context.resume();const source=context.createMediaStreamSource(stream);analyser=context.createAnalyser();analyser.fftSize=1024;analyser.smoothingTimeConstant=.65;source.connect(analyser);data=new Uint8Array(analyser.fftSize);micButton.textContent='Apagar micrófono';micButton.classList.add('active');message.textContent='Micrófono activo · Activá reconocimiento de voz';loop()}catch(err){stop();message.textContent=err.name==='NotAllowedError'?'Permiso de micrófono denegado. Revisá los permisos del navegador.':'No pude activar el micrófono ('+err.name+'). Probá con Chrome y HTTPS.'}}function loop(){if(!analyser)return;analyser.getByteTimeDomainData(data);let sum=0;for(let i=0;i<data.length;i++){const v=(data[i]-128)/128;sum+=v*v}const rms=Math.sqrt(sum/data.length);level=level*.72+rms*.28;bar.style.width=Math.min(100,level*950)+'%';const now=performance.now();if(level>.035){heardUntil=now+700;if(attentionActive){lastVoiceSound=now;attentionUntil=now+4500}}if(attentionActive && now>attentionUntil){attentionActive=false}if(attentionActive){message.textContent=now<heardUntil?'Te escucho 💜':'Estoy atenta a vos 💜';face.style.setProperty('--look-x','0px');face.style.setProperty('--look-y','0px')}else if(voiceWanted && voiceRunning){message.textContent=now<heardUntil?'Oigo sonido · Esperando «Hola, Iris»':'Esperando «Hola, Iris»…'}else if(voiceWanted){/* Conservar el mensaje de diagnóstico durante reinicios */}else{message.textContent=now<heardUntil?'Detecto sonido · Activá reconocimiento de voz':'Escuchando sonidos cercanos…'};frame=requestAnimationFrame(loop)}const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
let restartTimer=null,restartAttempts=0,voiceStarting=false,manualStop=false;
function clearRestart(){if(restartTimer!==null){clearTimeout(restartTimer);restartTimer=null}}
function stopVoice(){voiceWanted=false;manualStop=true;clearRestart();attentionActive=false;attentionUntil=0;if(recognition){try{recognition.abort()}catch(e){}}voiceRunning=false;voiceStarting=false;voiceButton.classList.remove('active');voiceButton.textContent='Reconocer «Hola, Iris»'}
function scheduleRestart(reason){if(!voiceWanted||!stream||document.hidden)return;clearRestart();restartAttempts++;if(restartAttempts>3){stopVoice();message.textContent='Reconocimiento detenido: Chrome lo interrumpió varias veces. Tocá para reintentar.';return}const delay=1500*restartAttempts;message.textContent='Reconocimiento interrumpido ('+reason+'). Reintento '+restartAttempts+'/3…';restartTimer=setTimeout(()=>{restartTimer=null;launchRecognition()},delay)}
function launchRecognition(){if(!voiceWanted||!stream||voiceRunning||voiceStarting||document.hidden)return;voiceStarting=true;try{recognition.start()}catch(e){voiceStarting=false;scheduleRestart('inicio fallido')}}
function startVoice(){if(!SpeechRecognition){message.textContent='Este navegador no admite reconocimiento de voz. Probá Chrome actualizado.';return}if(!stream){message.textContent='Primero activá el micrófono.';return}stopVoice();manualStop=false;voiceWanted=true;restartAttempts=0;recognition=new SpeechRecognition();recognition.lang='es-AR';recognition.continuous=true;recognition.interimResults=false;
recognition.onstart=()=>{voiceStarting=false;voiceRunning=true;restartAttempts=0;voiceButton.classList.add('active');voiceButton.textContent='Detener reconocimiento';message.textContent='Esperando «Hola, Iris»…'};
recognition.onresult=(event)=>{restartAttempts=0;for(let i=event.resultIndex;i<event.results.length;i++){if(!event.results[i].isFinal)continue;const phrase=event.results[i][0].transcript.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');if(/\bhola[\s,!.¿?¡]*iris\b/.test(phrase)){attentionActive=true;attentionUntil=performance.now()+4500;face.style.setProperty('--look-x','0px');face.style.setProperty('--look-y','0px');setMode('normal');message.textContent='¡Hola! Te escucho 💜'}}};
recognition.onerror=(event)=>{voiceStarting=false;voiceRunning=false;const err=event.error;if(err==='not-allowed'||err==='service-not-allowed'||err==='audio-capture'||err==='network'){stopVoice();message.textContent='Reconocimiento detenido ('+err+'). Revisá permisos, conexión o servicio de Chrome.'}else if(err==='no-speech'){message.textContent='No escuché palabras. Esperando…'}else if(err!=='aborted'){message.textContent='Reconocimiento: '+err}};
recognition.onend=()=>{voiceRunning=false;voiceStarting=false;if(voiceWanted&&!manualStop&&stream)scheduleRestart('fin de sesión')};
voiceButton.classList.add('active');voiceButton.textContent='Detener reconocimiento';launchRecognition()}
voiceButton.addEventListener('click',()=>voiceWanted?stopVoice():startVoice());micButton.addEventListener('click',()=>stream?stop():start());document.addEventListener('visibilitychange',()=>{if(document.hidden && stream)stop();if(!document.hidden)face.style.setProperty('--blink','1')});window.addEventListener('pagehide',stop);
</script></body></html>
